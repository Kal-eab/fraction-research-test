const fractionPairs = [
    { id: 1, n1: 5, d1: 7, n2: 11, d2: 15, correct: '<' },
    { id: 2, n1: 7, d1: 9, n2: 13, d2: 17, correct: '>' },

    { id: 10, n1: 13, d1: 17, n2: 9, d2: 12, correct: '>' }
];

let submissions = [];
let state = {view:'welcome', participantName:'', cohort:'', questions:[], currentIndex:0, responses:[], timer:20, timerInterval:null, adminError:false, busy:false};

async function loadSubmissions(){
  const {data,error}=await supabaseClient.from('student_submissions').select('*').order('timestamp',{ascending:false});
  if(error) throw error;
  submissions=(data||[]).map(row=>({...row, responses:Array.isArray(row.responses)?row.responses:[]}));
}
function showDatabaseError(error, action){
  console.error(action, error);
  alert(action+' failed: '+(error?.message||'Unknown database error')+'\n\nCheck your Supabase table, RLS policies, and internet connection.');
}
function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function sectionLabel(type){ return type==='number'?'Fraction comparison':type==='pie'?'Pie chart comparison':'Bar diagram comparison'; }
function getQuestionSet(){
  const seq=[];
  ['number','pie','bar'].forEach(type=>fractionPairs.forEach(q=>seq.push({...q,type})));
  return seq;
}
function normalizeResponses(s){
  const old = Array.isArray(s.responses) ? s.responses : [];
  return getQuestionSet().map((q,i)=>{
    const found=old.find(r=>Number(r.questionId)===q.id && r.type===q.type) || old[i] || {};
    const answer=['>','<','='].includes(found.userAnswer) ? found.userAnswer : '-';
    return {questionId:q.id, questionNumber:i+1, type:q.type, correctAnswer:q.correct, userAnswer:answer, isCorrect:answer===q.correct};
  });
}
function scoreFor(s,type){
  const rs=normalizeResponses(s).filter(r=>!type || r.type===type);
  return rs.filter(r=>r.isCorrect).length;
}
function totalFor(s){return scoreFor(s,null)}

 const app=document.getElementById('app');
 if(state.view==='welcome'){

   <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-3">Fraction Comparison Research Test</h1>

   <div class="max-w-md mx-auto text-left space-y-3 mb-8 bg-slate-50 p-6 rounded-xl border border-slate-200">
    <label class="block text-sm font-medium">Participant Full Name</label>
    <input id="participantNameInput" class="w-full px-4 py-3 border border-slate-300 rounded-lg" placeholder="Enter full name">
   </div>
   <div class="flex flex-col sm:flex-row justify-center gap-4">
    <button onclick="startTest()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-8 py-3 rounded-xl">Start Assessment</button>
    <button onclick="showAdminLogin()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-6 py-3 rounded-xl">Researcher Portal</button>
   </div></div>`;
 } else if(state.view==='test'){
  const q=state.questions[state.currentIndex];
  app.innerHTML=`<div class="bg-white shadow-xl rounded-2xl p-6 sm:p-8 border border-slate-100">
   <div class="flex justify-between items-center mb-6 pb-4 border-b"><div><span class="text-xs font-bold uppercase text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">Question ${state.currentIndex+1} of 30</span><p class="text-xs text-slate-500 mt-2">Cohort ${state.cohort} · ${sectionLabel(q.type)}</p></div>
   <div class="bg-amber-50 text-amber-700 px-3 py-2 rounded-lg font-mono font-bold"><span id="timerDisplay">${state.timer}</span>s</div></div>
   <div class="mb-8 min-h-[160px] flex flex-col items-center justify-center">${renderVisual(q)}</div>
   <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
    <button onclick="submitAnswer('>')" class="p-4 border-2 border-slate-200 hover:border-indigo-600 hover:bg-indigo-50 rounded-xl font-bold">Greater Than (&gt;)</button>
    <button onclick="submitAnswer('<')" class="p-4 border-2 border-slate-200 hover:border-indigo-600 hover:bg-indigo-50 rounded-xl font-bold">Less Than (&lt;)</button>
    <button onclick="submitAnswer('=')" class="p-4 border-2 border-slate-200 hover:border-indigo-600 hover:bg-indigo-50 rounded-xl font-bold">Equal To (=)</button>
   </div><div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden"><div class="bg-indigo-600 h-full" style="width:${((state.currentIndex+1)/30)*100}%"></div></div>
  </div>`;
  startTimer();
 } else if(state.view==='complete'){
  const s=state.responses.filter(r=>r.isCorrect).length;

 } else if(state.view==='admin_login'){
  app.innerHTML=`<div class="bg-white shadow-xl rounded-2xl p-8 max-w-md mx-auto"><h2 class="text-xl font-bold mb-4 text-center">Researcher Portal Login</h2><label class="block text-sm font-medium mb-2">Researcher email</label><input type="email" id="adminEmailInput" value="${ADMIN_EMAIL}" class="w-full px-4 py-3 border rounded-lg mb-3"><label class="block text-sm font-medium mb-2">Password</label><input type="password" id="adminPassInput" onkeydown="if(event.key==='Enter')verifyAdmin()" placeholder="Supabase account password" class="w-full px-4 py-3 border rounded-lg mb-4">${state.adminError?'<p class="text-red-600 text-sm mb-3">Incorrect password. Try again.</p>':''}<div class="flex gap-3"><button onclick="verifyAdmin()" class="flex-1 bg-indigo-600 text-white py-3 rounded-lg">Login</button><button onclick="resetApp()" class="px-5 bg-slate-200 rounded-lg">Cancel</button></div></div>`;
 } else {
  renderAdmin(app);
 }
}
function startTest(){
 const input=document.getElementById('participantNameInput');
 const name=input?input.value.trim():'';
 if(!name){alert('Please enter the participant full name.');return}
 state.participantName=name;
 state.cohort=['A','B','C'][Math.floor(Math.random()*3)];
 state.questions=getQuestionSet(); state.responses=[]; state.currentIndex=0; state.view='test'; render();
}
function startTimer(){
 clearInterval(state.timerInterval); state.timer=20;
 state.timerInterval=setInterval(()=>{state.timer--;const el=document.getElementById('timerDisplay');if(el)el.textContent=state.timer;if(state.timer<=0){clearInterval(state.timerInterval);submitAnswer('-')}},1000);
}
function submitAnswer(answer){
 clearInterval(state.timerInterval);const q=state.questions[state.currentIndex];
 state.responses.push({questionId:q.id,questionNumber:state.currentIndex+1,type:q.type,correctAnswer:q.correct,userAnswer:answer,isCorrect:answer===q.correct});
 if(state.currentIndex<29){state.currentIndex++;render()}else finishTest();
}
async function finishTest(){
 const record={id:makeId(),name:state.participantName,cohort:state.cohort,source:'Online assessment',responses:state.responses.slice(),score:state.responses.filter(r=>r.isCorrect).length,timestamp:new Date().toISOString()};
 state.pendingRecord=record;state.view='saving';render();
 await retrySubmission();
}
async function retrySubmission(){
 const record=state.pendingRecord;if(!record)return;
 const {error}=await supabaseClient.from('student_submissions').insert(record);
 if(error){console.error('Submission failed',error);alert('Submission was not saved: '+error.message+'\nPlease check your connection and try again.');return}
 state.pendingRecord=null;state.view='complete';render();
}
function makeId(){return 'S-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7).toUpperCase()}
function showAdminLogin(){state.view='admin_login';state.adminError=false;render()}
async function verifyAdmin(){
 const email=document.getElementById('adminEmailInput')?.value.trim();
 const password=document.getElementById('adminPassInput')?.value;
 const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
 if(error||email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){state.adminError=true;render();document.getElementById('adminPassInput')?.focus();return}
 try{await loadSubmissions();state.adminError=false;state.view='admin_dashboard';render()}catch(e){showDatabaseError(e,'Loading researcher records')}
}
function resetApp(){clearInterval(state.timerInterval);state.view='welcome';state.participantName='';render()}
async function logout(){await supabaseClient.auth.signOut();submissions=[];state.view='welcome';render()}
function adminNav(view){
 state.view=view;render();
}
async function refreshRecords(){try{await loadSubmissions();render()}catch(e){showDatabaseError(e,'Refreshing records')}}
function adminHeader(active){
 const tabs=[['admin_dashboard','Overview'],['admin_entry','Manual Data Entry'],['admin_raw','Raw Student Data'],['admin_analysis','Statistical Analysis']];
 return `<div class="mb-6"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4"><div><p class="text-sm text-indigo-600 font-semibold">RESEARCHER PORTAL</p><h1 class="text-2xl font-bold">Research Data Management</h1><p class="text-sm text-slate-500">Records are stored centrally in Supabase and can be viewed from your researcher account.</p></div><div class="flex gap-2"><button onclick="refreshRecords()" class="px-4 py-2 bg-indigo-50 text-indigo-700 rounded-lg">Refresh data</button><button onclick="logout()" class="px-4 py-2 bg-slate-200 rounded-lg">Logout</button></div></div><div class="flex flex-wrap gap-2">${tabs.map(([v,l])=>`<button onclick="adminNav('${v}')" class="px-4 py-2 rounded-lg text-sm font-semibold ${active===v?'bg-indigo-600 text-white':'bg-white border hover:bg-slate-100'}">${l}</button>`).join('')}</div></div>`;
}

 if(state.view==='admin_dashboard'){

  app.innerHTML=adminHeader('admin_dashboard')+`<div class="grid sm:grid-cols-3 gap-4 mb-6">
   ${metric('Total students',submissions.length)}${metric('Average total score',submissions.length?avg.toFixed(2)+'/30':'—')}${metric('Records with raw answers',submissions.filter(s=>normalizeResponses(s).length===30).length)}
  </div><div class="grid md:grid-cols-2 gap-4"><div class="bg-white rounded-xl border p-5"><h2 class="font-bold text-lg mb-2">Raw data collection</h2><p class="text-sm text-slate-600 mb-4">Enter each student's 30 individual answers from your paper records. Scores are calculated automatically.</p><button onclick="adminNav('admin_entry')" class="bg-indigo-600 text-white px-4 py-2 rounded-lg">Enter student data</button></div><div class="bg-white rounded-xl border p-5"><h2 class="font-bold text-lg mb-2">Statistical results</h2><p class="text-sm text-slate-600 mb-4">View group summaries, ANOVA calculations, F-statistics, p-values, and effect sizes.</p><button onclick="adminNav('admin_analysis')" class="bg-indigo-600 text-white px-4 py-2 rounded-lg">Open analysis</button></div></div>
  <div class="bg-white rounded-xl border p-5 mt-5"><div class="flex flex-wrap justify-between gap-3 items-center"><h2 class="font-bold">Data backup</h2><div class="flex gap-2"><button onclick="exportCSV()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm">Export full CSV</button><button onclick="exportJSON()" class="bg-slate-700 text-white px-4 py-2 rounded-lg text-sm">Export JSON backup</button></div></div><p class="text-xs text-slate-500 mt-2">Download backups regularly. Student submissions are saved in the shared Supabase database.</p></div>`;
 }else if(state.view==='admin_entry'){
  app.innerHTML=adminHeader('admin_entry')+`<div class="bg-white rounded-xl border p-5">
   <h2 class="text-xl font-bold mb-1">Enter one student's raw answers</h2><p class="text-sm text-slate-500 mb-5">Enter the answer written on the paper for every question. Leave unanswered questions as “No answer”. Scores will be calculated when you save.</p>
   <form id="manualEntryForm" onsubmit="saveManualEntry(event)">
    <div class="grid sm:grid-cols-2 gap-4 mb-6"><div><label class="block text-sm font-semibold mb-1">Student full name *</label><input id="manualName" required class="w-full border rounded-lg px-3 py-2" placeholder="Full name"></div><div><label class="block text-sm font-semibold mb-1">Cohort / Group *</label><select id="manualCohort" class="w-full border rounded-lg px-3 py-2"><option value="A">Group A</option><option value="B">Group B</option><option value="C">Group C</option></select></div></div>
    ${['number','pie','bar'].map((type,section)=>`<section class="border rounded-xl p-4 mb-5"><div class="flex flex-wrap justify-between items-center mb-3"><div><h3 class="font-bold">${section+1}. ${sectionLabel(type)}</h3><p class="text-xs text-slate-500">Questions ${section*10+1}–${section*10+10}</p></div><span id="sectionCount_${type}" class="text-sm font-semibold text-indigo-600">0/10 answered</span></div><div class="grid sm:grid-cols-2 gap-3">${fractionPairs.map((q,i)=>{const num=section*10+i+1;return `<div class="flex items-center justify-between gap-3 bg-slate-50 rounded-lg p-3"><label for="ans_${num}" class="text-sm font-medium">Q${num}: ${q.n1}/${q.d1} vs ${q.n2}/${q.d2}</label><select id="ans_${num}" name="ans_${num}" onchange="updateEntryCounts()" class="border rounded-md px-2 py-2 bg-white text-sm"><option value="-">No answer</option><option value=">">&gt;</option><option value="<">&lt;</option><option value="=">=</option></select></div>`}).join('')}</div></section>`).join('')}
    <div class="flex flex-wrap gap-3"><button type="submit" class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold">Save student raw data</button><button type="reset" onclick="setTimeout(updateEntryCounts,0)" class="bg-slate-200 px-5 py-3 rounded-lg">Clear form</button></div>
   </form></div>`;
 }else if(state.view==='admin_raw'){
  const rows=submissions.map((s,i)=>{const rs=normalizeResponses(s);return `<details class="bg-white border rounded-xl mb-3"><summary class="cursor-pointer p-4 flex flex-wrap justify-between gap-2"><span><b>${i+1}. ${escapeHtml(s.name||'Unnamed student')}</b> <span class="text-sm text-slate-500">· Group ${escapeHtml(s.cohort||'?')} · ${escapeHtml(s.source||'Online assessment')}</span></span><span class="font-semibold text-indigo-700">${totalFor(s)}/30</span></summary><div class="px-4 pb-4"><div class="grid sm:grid-cols-4 gap-2 text-sm mb-4"><div class="bg-slate-50 p-3 rounded">Fraction: <b>${scoreFor(s,'number')}/10</b></div><div class="bg-slate-50 p-3 rounded">Pie chart: <b>${scoreFor(s,'pie')}/10</b></div><div class="bg-slate-50 p-3 rounded">Bar diagram: <b>${scoreFor(s,'bar')}/10</b></div><div class="bg-slate-50 p-3 rounded">Date: <b>${s.timestamp?new Date(s.timestamp).toLocaleString():'—'}</b></div></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-100"><tr><th class="p-2 text-left">Q</th><th class="p-2 text-left">Format</th><th class="p-2 text-left">Correct answer</th><th class="p-2 text-left">Student answer</th><th class="p-2 text-left">Result</th></tr></thead><tbody>${rs.map(r=>`<tr class="border-t"><td class="p-2">${r.questionNumber}</td><td class="p-2">${sectionLabel(r.type)}</td><td class="p-2">${escapeHtml(r.correctAnswer)}</td><td class="p-2">${r.userAnswer==='-'?'No answer':escapeHtml(r.userAnswer)}</td><td class="p-2">${r.isCorrect?'<span class="text-emerald-700 font-semibold">Correct</span>':'<span class="text-red-600">Incorrect</span>'}</td></tr>`).join('')}</tbody></table></div><div class="flex justify-end mt-3"><button onclick="deleteRecord('${escapeHtml(s.id||'')}')" class="text-red-600 text-sm underline">Delete this student record</button></div></div></details>`}).join('');
  app.innerHTML=adminHeader('admin_raw')+`<div class="flex flex-wrap items-center justify-between gap-3 mb-4"><div><h2 class="text-xl font-bold">Complete raw student records</h2><p class="text-sm text-slate-500">Expand a student to inspect all 30 answers and scoring.</p></div><div class="flex gap-2"><button onclick="exportCSV()" class="bg-emerald-600 text-white px-3 py-2 rounded-lg text-sm">Export CSV</button><button onclick="exportJSON()" class="bg-slate-700 text-white px-3 py-2 rounded-lg text-sm">Export JSON</button></div></div>${submissions.length?rows:'<div class="bg-white border rounded-xl p-8 text-center text-slate-500">No student records yet. Use Manual Data Entry to add paper-based results.</div>'}`;
 }else if(state.view==='admin_analysis'){
  const overall=anovaFor('total'), sections=[['number','Fraction'],['pie','Pie chart'],['bar','Bar diagram']].map(([type,label])=>({label,...anovaFor(type)}));
  app.innerHTML=adminHeader('admin_analysis')+`<div class="bg-white border rounded-xl p-5 mb-5"><h2 class="text-xl font-bold mb-1">Statistical Analysis</h2><p class="text-sm text-slate-500 mb-4">One-way ANOVA compares the mean scores of Groups A, B, and C. Results use student records loaded from the shared Supabase database.</p>${anovaPanel('Overall total score (/30)',overall)}</div>
  <div class="bg-white border rounded-xl p-5"><h2 class="text-xl font-bold mb-4">Analysis by question format</h2><div class="space-y-5">${sections.map(x=>anovaPanel(x.label+' score (/10)',x)).join('')}</div></div>
  <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 mt-5 text-sm text-amber-900"><b>Interpretation:</b> A p-value below 0.05 is evidence that at least one cohort mean differs. ANOVA does not identify which specific groups differ. The analysis requires enough students in the groups; small or empty groups will be marked insufficient.</div>`;
 }
}
function metric(label,value){return `<div class="bg-white border rounded-xl p-5"><p class="text-sm text-slate-500">${label}</p><p class="text-2xl font-bold mt-1">${value}</p></div>`}
function updateEntryCounts(){
 ['number','pie','bar'].forEach((type,idx)=>{let count=0;for(let i=1+idx*10;i<=10+idx*10;i++){const el=document.getElementById('ans_'+i);if(el&&el.value!=='-')count++}const target=document.getElementById('sectionCount_'+type);if(target)target.textContent=count+'/10 answered'});
}
async function saveManualEntry(event){
 event.preventDefault();const name=document.getElementById('manualName').value.trim();const cohort=document.getElementById('manualCohort').value;
 if(!name){alert('Enter the student name.');return}
 const responses=getQuestionSet().map((q,i)=>{const answer=document.getElementById('ans_'+(i+1)).value;return {questionId:q.id,questionNumber:i+1,type:q.type,correctAnswer:q.correct,userAnswer:answer,isCorrect:answer===q.correct}});
 const record={id:makeId(),name,cohort,source:'Manual paper data entry',responses,score:responses.filter(r=>r.isCorrect).length,timestamp:new Date().toISOString()};
 const {error}=await supabaseClient.from('student_submissions').insert(record);
 if(error){showDatabaseError(error,'Saving manual student data');return}
 await loadSubmissions();alert('Student raw data saved to Supabase. Total score: '+record.score+'/30');render();
}
async function deleteRecord(id){
 if(!confirm("Delete this student's complete raw record from the shared database? This cannot be undone unless you have a backup."))return;
 const {error}=await supabaseClient.from('student_submissions').delete().eq('id',id);
 if(error){showDatabaseError(error,'Deleting student record');return}
 await loadSubmissions();render();
}
function exportCSV(){
 if(!submissions.length){alert('No records to export.');return}
 const headers=['ParticipantName','Cohort','Source','Timestamp',...Array.from({length:30},(_,i)=>'Q'+(i+1)+'_Answer'),...Array.from({length:30},(_,i)=>'Q'+(i+1)+'_CorrectAnswer'),'FractionScore','PieChartScore','BarDiagramScore','TotalScore'];
 const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const lines=[headers.map(quote).join(',')];
 submissions.forEach(s=>{const rs=normalizeResponses(s);const vals=[s.name,s.cohort,s.source,s.timestamp,...rs.map(r=>r.userAnswer),...rs.map(r=>r.correctAnswer),scoreFor(s,'number'),scoreFor(s,'pie'),scoreFor(s,'bar'),totalFor(s)];lines.push(vals.map(quote).join(','))});
 downloadFile('fraction_research_raw_data.csv','\uFEFF'+lines.join('\r\n'),'text/csv;charset=utf-8;');
}
function exportJSON(){if(!submissions.length){alert('No records to export.');return}downloadFile('fraction_research_full_backup.json',JSON.stringify(submissions,null,2),'application/json')}
function downloadFile(filename,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
// Regularized incomplete beta function for the exact upper-tail F-test probability.
function logGamma(z){
 const p=[676.5203681218851,-1259.1392167224028,771.3234287776531,-176.6150291621406,12.507343278686905,-0.13857109526572012,9.984369578019572e-6,1.5056327351493116e-7];
 if(z<0.5)return Math.log(Math.PI)-Math.log(Math.sin(Math.PI*z))-logGamma(1-z);
 z-=1;let x=0.99999999999980993;for(let i=0;i<p.length;i++)x+=p[i]/(z+i+1);
 const t=z+p.length-0.5;return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x);
}
function betaCF(a,b,x){
 const max=200,eps=3e-14,fp=1e-300;const qab=a+b,qap=a+1,qam=a-1;let c=1,d=1-qab*x/qap;if(Math.abs(d)<fp)d=fp;d=1/d;let h=d;
 for(let m=1;m<=max;m++){let m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<fp)d=fp;c=1+aa/c;if(Math.abs(c)<fp)c=fp;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<fp)d=fp;c=1+aa/c;if(Math.abs(c)<fp)c=fp;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<eps)break}return h;
}
function regBeta(x,a,b){
 if(x<=0)return 0;if(x>=1)return 1;
 const bt=Math.exp(logGamma(a+b)-logGamma(a)-logGamma(b)+a*Math.log(x)+b*Math.log1p(-x));
 if(x<(a+1)/(a+b+2))return bt*betaCF(a,b,x)/a;
 return 1-bt*betaCF(b,a,1-x)/b;
}
function anovaFor(type){
 const values={A:[],B:[],C:[]};
 submissions.forEach(s=>{if(values[s.cohort])values[s.cohort].push(type==='total'?totalFor(s):scoreFor(s,type))});
 const groupStats={};let all=[];
 ['A','B','C'].forEach(g=>{const v=values[g];all=all.concat(v);const n=v.length,mean=n?v.reduce((a,b)=>a+b,0)/n:0,variance=n>1?v.reduce((a,b)=>a+(b-mean)**2,0)/(n-1):0;groupStats[g]={n,mean,sd:Math.sqrt(variance),scores:v}});
 const N=all.length,k=['A','B','C'].filter(g=>values[g].length>0).length,grand=N?all.reduce((a,b)=>a+b,0)/N:0;let ssb=0,ssw=0;
 ['A','B','C'].forEach(g=>{const z=groupStats[g];ssb+=z.n*(z.mean-grand)**2;z.scores.forEach(v=>ssw+=(v-z.mean)**2)});
 const dfB=k-1,dfW=N-k,msb=dfB>0?ssb/dfB:0,msw=dfW>0?ssw/dfW:0,F=(dfB>0&&msw>0)?msb/msw:0;
 const p=(k>=2&&N>k&&msw>0)?regBeta(dfW/(dfW+dfB*F),dfW/2,dfB/2):null;
 const sst=ssb+ssw,eta=sst>0?ssb/sst:null,omega=(N>k&&sst>0)?(ssb-dfB*msw)/(sst+msw):null;
 return {groupStats,N,grand,ssb,ssw,sst,dfB,dfW,msb,msw,F,p,eta,omega};
}
function anovaPanel(title,d){
 const fmt=x=>Number.isFinite(x)?x.toFixed(4):'—';
 return `<div class="border rounded-lg p-4"><h3 class="font-bold mb-3">${title}</h3><div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">${[['Between-group SS',fmt(d.ssb)],['Within-group SS',fmt(d.ssw)],['F statistic',fmt(d.F)],['p-value',d.p===null?'Insufficient data':fmt(d.p)],['df between',d.dfB],['df within',d.dfW],['Eta squared',d.eta===null?'—':fmt(d.eta)],['Omega squared',d.omega===null?'—':fmt(d.omega)]].map(([a,b])=>`<div class="bg-slate-50 p-3 rounded"><p class="text-xs text-slate-500">${a}</p><p class="font-bold">${b}</p></div>`).join('')}</div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-100"><tr><th class="p-2 text-left">Group</th><th class="p-2">n</th><th class="p-2">Mean</th><th class="p-2">SD</th></tr></thead><tbody>${['A','B','C'].map(g=>{const z=d.groupStats[g];return `<tr class="border-t"><td class="p-2 font-semibold">Group ${g}</td><td class="p-2 text-center">${z.n}</td><td class="p-2 text-center">${z.n?fmt(z.mean):'—'}</td><td class="p-2 text-center">${z.n>1?fmt(z.sd):'—'}</td></tr>`}).join('')}</tbody></table></div><p class="text-xs text-slate-500 mt-3">${d.p===null?'At least two groups with observations and residual degrees of freedom are needed for the ANOVA test.':d.p<0.05?'p < 0.05: evidence that at least one group mean differs.':'p ≥ 0.05: insufficient evidence of a difference between group means.'}</p></div>`;
}
function renderVisual(q){
 if(q.type==='number')return `<div class="flex items-center justify-center gap-6 text-3xl sm:text-4xl font-bold font-mono"><div class="bg-slate-50 px-6 py-4 rounded-xl border">${q.n1}/${q.d1}</div><div class="w-14 h-14 border-2 border-dashed rounded-xl flex items-center justify-center text-slate-400">?</div><div class="bg-slate-50 px-6 py-4 rounded-xl border">${q.n2}/${q.d2}</div></div>`;
 if(q.type==='pie')return `<div class="flex items-center justify-center gap-8"><div class="text-center">${createPieSvg(q.n1,q.d1)}<p class="text-sm mt-2">${q.n1}/${q.d1}</p></div><div class="font-bold text-2xl">?</div><div class="text-center">${createPieSvg(q.n2,q.d2)}<p class="text-sm mt-2">${q.n2}/${q.d2}</p></div></div>`;
 return `<div class="flex flex-col gap-5 w-full max-w-md">${[[q.n1,q.d1],[q.n2,q.d2]].map(([n,d])=>`<div class="flex items-center justify-between gap-3"><span>${n}/${d}</span>${createBarSvg(n,d)}</div>`).join('')}</div>`;
}
function createPieSvg(num,den){const size=100,c=50,r=40,step=360/den;let paths='';for(let i=0;i<den;i++){const a=i*step-90,b=(i+1)*step-90,x1=c+r*Math.cos(a*Math.PI/180),y1=c+r*Math.sin(a*Math.PI/180),x2=c+r*Math.cos(b*Math.PI/180),y2=c+r*Math.sin(b*Math.PI/180);paths+=`<path d="M ${c} ${c} L ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2} Z" fill="${i<num?'#cbd5e1':'white'}" stroke="#334155" stroke-width="1.5"/>`}return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg>`}
function createBarSvg(num,den){const w=200,h=24,sw=w/den;let rects='';for(let i=0;i<den;i++)rects+=`<rect x="${i*sw}" y="0" width="${sw}" height="${h}" fill="${i<num?'#cbd5e1':'white'}" stroke="#334155" stroke-width="1.5"/>`;return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${rects}</svg>`}

  const {data}=await supabaseClient.auth.getSession();

  if(user?.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase()){

  }
};
